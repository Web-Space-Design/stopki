<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopka e-mail — MentalTech (szkło)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background-color:#f2f6fa;">
  <!--
    Podgląd w przeglądarce. W poczcie wklej zawartość signature-glass-inline-only.html (tylko tabela).
    Prostokąt podzielony na pół: z lewej szkło (glassmorphism) + logo, z prawej niebieski + kontakt, na środku zdjęcie.
    Rogi zaokrąglone bezpośrednio na skrajnych komórkach (bez cieni). Kolory marki: #006397 / #92CCFF.
    Czcionka: Poppins (fallback Arial). Ikony: mentaltech/icons/*.svg (GitHub Raw). git push po wgraniu.
  -->

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;background-color:#f2f6fa;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" align="center" style="border-collapse:collapse;width:100%;max-width:560px;font-family:'Poppins',Arial,Helvetica,sans-serif;">
          <tr>
            <!-- Lewa: szkło + logo -->
            <td width="210" valign="middle" bgcolor="#EBEEF3" style="width:210px;border-top-left-radius:28px;border-bottom-left-radius:28px;padding:28px 20px 28px 30px;background-color:rgba(235,238,243,0.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-align:left;">
              <p style="margin:0 0 6px 0;font-family:'Poppins',Arial,Helvetica,sans-serif;font-size:20px;font-weight:600;line-height:1.25;color:#1a1a1a;">Barbara Makowiec</p>
              <p style="margin:0 0 18px 0;font-family:'Poppins',Arial,Helvetica,sans-serif;font-size:14px;line-height:1.4;color:#3a3a3a;">Partner Technologiczny w Biznesie</p>
              <img src="https://www.mentaltech.pl/assets/images/branding/logo-full-light.png" alt="MentalTech" width="130" style="display:block;border:0;outline:none;max-width:130px;width:130px;height:auto;">
            </td>
            <!-- Środek: zdjęcie na styku obu kolorów -->
            <td width="140" align="center" valign="middle" bgcolor="#006397" style="width:140px;background-color:#006397;background:linear-gradient(to right, rgba(235,238,243,0.4) 0%, rgba(235,238,243,0.4) 50%, #006397 50%, #006397 100%);">
              <img src="https://www.mentaltech.pl/assets/team/barbara.jpeg" alt="Barbara Makowiec" width="128" height="128" style="display:block;border:4px solid #ffffff;outline:none;border-radius:50%;width:128px;height:128px;max-width:128px;object-fit:cover;object-position:50% 22%;margin:0 auto;">
            </td>
            <!-- Prawa: niebieski, kontakt -->
            <td width="210" valign="middle" bgcolor="#006397" style="width:210px;border-top-right-radius:28px;border-bottom-right-radius:28px;padding:28px 30px 28px 20px;background-color:#006397;text-align:left;font-family:'Poppins',Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-bottom:10px;">
                <tr>
                  <td valign="middle" width="24" style="padding:0 8px 0 0;">
                    <img src="https://raw.githubusercontent.com/Web-Space-Design/stopki/main/mentaltech/icons/at-sign-white.svg" alt="" width="16" height="16" style="display:block;border:0;width:16px;height:16px;">
                  </td>
                  <td valign="middle"><a href="mailto:biuro@mentaltech.pl" style="color:#ffffff;text-decoration:none;font-family:'Poppins',Arial,Helvetica,sans-serif;font-size:14px;">biuro@mentaltech.pl</a></td>
                </tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-bottom:10px;">
                <tr>
                  <td valign="middle" width="24" style="padding:0 8px 0 0;">
                    <img src="https://raw.githubusercontent.com/Web-Space-Design/stopki/main/mentaltech/icons/phone-call-white.svg" alt="" width="16" height="16" style="display:block;border:0;width:16px;height:16px;">
                  </td>
                  <td valign="middle"><a href="tel:+48881912998" style="color:#ffffff;text-decoration:none;font-family:'Poppins',Arial,Helvetica,sans-serif;font-size:14px;">+48 881 912 998</a></td>
                </tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                <tr>
                  <td valign="middle" width="24" style="padding:0 8px 0 0;">
                    <img src="https://raw.githubusercontent.com/Web-Space-Design/stopki/main/mentaltech/icons/globe-white.svg" alt="" width="16" height="16" style="display:block;border:0;width:16px;height:16px;">
                  </td>
                  <td valign="middle"><a href="https://www.mentaltech.pl/" target="_blank" rel="noopener noreferrer" style="color:#ffffff;text-decoration:none;font-family:'Poppins',Arial,Helvetica,sans-serif;font-size:14px;">www.mentaltech.pl</a></td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
